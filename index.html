<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#24150f"><title>テトロミノ | PowerPoint Webアプリ</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#18100c;font-family:system-ui,'Yu Gothic',sans-serif;touch-action:none}#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}#stage{width:1125px;height:2000px;position:absolute;top:0;left:0;transform-origin:top left;background:url('background.png') center/100% 100% no-repeat;user-select:none;-webkit-user-select:none;touch-action:none}button{font:inherit;cursor:pointer;touch-action:manipulation}#infoHit{position:absolute;top:8px;right:22px;width:180px;height:192px;background:transparent;border:0}#boardFrame{position:absolute;left:191px;top:264px;width:743px;height:1124px;padding:22px;border:9px solid #8b9095;border-radius:22px;background:linear-gradient(115deg,#c8cace 2%,#eeeeee 19%,#a5a8ad 45%,#d5d9dc 69%,#8b8d90 100%);box-shadow:inset 0 0 12px #fff9,0 18px 25px #0009,0 0 0 4px #343434}#board{position:relative;width:100%;height:100%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(8,1fr);border:3px solid #30343a;background:#adb0b5;touch-action:none} .cell{border-right:2px solid #313638;border-bottom:2px solid #313638;background:linear-gradient(100deg,#d6d8da 0%,#a5a8ac 45%,#bfc1c4 100%);position:relative}.cell:after{content:'';position:absolute;inset:2px;border-top:1px solid #fff4} .piececell{position:absolute;border:3px solid #111a24;border-radius:9px;box-shadow:inset 0 9px 0 #ffffff5b,inset 0 -10px 0 #0000002a,0 3px 5px #0005;pointer-events:none;z-index:3}.sample{opacity:.34;box-shadow:inset 0 0 0 2px #ffffff70;z-index:1;border:3px dashed #333}.dragcell{z-index:20;opacity:.84}#palette{position:absolute;left:29px;top:1422px;width:1067px;height:260px;display:flex;align-items:center;gap:10px;padding:12px;background:linear-gradient(#181c1dda,#33261de7);border:3px solid #777;border-radius:20px;box-shadow:0 8px 12px #0009} .tile{flex:1;height:218px;background:linear-gradient(140deg,#27221ce8,#0b0d0de9);border:3px solid #7b878e;border-radius:19px;position:relative;padding:0;overflow:hidden}.tile.selected{border:8px solid #f9db70;box-shadow:0 0 16px #e5c768}.tile .mini{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);display:grid;gap:3px}.mini-square{width:39px;height:39px;border:2px solid #15202a;border-radius:6px;box-shadow:inset 0 6px #fff6,inset 0 -5px #0002}.tile label{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:26px;font-weight:900;color:#eee;pointer-events:none}#actions{position:absolute;left:27px;right:27px;top:1710px;height:143px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px}.action{border-radius:27px;border:5px solid #8e9899;color:white;font-weight:900;font-size:39px;box-shadow:inset 0 10px 4px #ffffff55,inset 0 -10px 5px #0003,0 8px 7px #0009}.action:active{filter:brightness(1.2)}#rotate{background:linear-gradient(#37a8f3,#0655b8)}#undo{background:linear-gradient(#9e9e9e,#333)}#reset{background:linear-gradient(#f35b51,#ae1717)}#hint{position:absolute;top:1872px;left:0;width:100%;text-align:center;font-size:32px;font-weight:700;color:#fff;filter:drop-shadow(1px 3px 3px black)}#overlay{position:absolute;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50}#overlay.show{display:flex}.modal{width:87%;background:#f0f0ed;border:10px solid #7d8b90;border-radius:32px;padding:45px;text-align:center;color:#202025;box-shadow:0 15px 30px #0009}.modal h1{font-size:58px;margin:10px 0 26px}.modal p{font-size:35px;line-height:1.5}.modal button{display:block;width:100%;margin:16px 0;padding:28px 12px;border-radius:18px;font-size:38px;color:white;border:3px solid #285836;background:#287e57;font-weight:900}.modal button.alt{background:#565c69;border-color:#333}.modal button.cancel{background:#aa4242;border-color:#7e2222}#toast{position:absolute;left:8%;right:8%;top:1325px;z-index:40;background:#1b2425e8;color:white;border:3px solid #d4d8da;border-radius:16px;font-size:32px;font-weight:800;padding:15px 10px;text-align:center;display:none}#toast.on{display:block}
</style></head><body><div id="viewport"><main id="stage" aria-label="テトロミノパズル"><button id="infoHit" aria-label="この教材について"></button><div id="boardFrame"><div id="board" aria-label="5列8行のパズル盤"></div></div><div id="palette" aria-label="ピースを選ぶ"></div><div id="actions"><button class="action" id="rotate">⟳ 回転</button><button class="action" id="undo">↶ 1つ戻す</button><button class="action" id="reset">▤ やりなおし</button></div><div id="hint">ピースを選んでタップ、またはドラッグで配置</div><div id="toast" role="status"></div><div id="overlay" class="show"><div id="dialog" class="modal"></div></div></main></div><script>
(()=>{'use strict';
const W=5,H=8,types={I:[[0,0],[0,1],[0,2],[0,3]],O:[[0,0],[1,0],[0,1],[1,1]],T:[[0,0],[1,0],[2,0],[1,1]],L:[[0,0],[0,1],[0,2],[1,2]],S:[[1,0],[2,0],[0,1],[1,1]]},colors={I:'#16caf1',O:'#f4d12a',T:'#ab3aeb',L:'#f29128',S:'#28cb64'};
// 5×8を完全に敷き詰められる、検証済みの10配置
const layout=[["I",[[0,0],[0,1],[0,2],[0,3]]],["L",[[1,0],[1,1],[1,2],[2,2]]],["S",[[2,0],[2,1],[3,1],[3,2]]],["L",[[3,0],[4,0],[4,1],[4,2]]],["O",[[3,3],[3,4],[4,3],[4,4]]],["O",[[1,3],[1,4],[2,3],[2,4]]],["T",[[0,4],[0,5],[0,6],[1,5]]],["T",[[3,6],[4,5],[4,6],[4,7]]],["S",[[1,6],[2,5],[2,6],[3,5]]],["I",[[0,7],[1,7],[2,7],[3,7]]]];
const stage=document.getElementById('stage'),board=document.getElementById('board'),palette=document.getElementById('palette'),overlay=document.getElementById('overlay'),dialog=document.getElementById('dialog'),toast=document.getElementById('toast');let suppressClick=false;let scale=1,mode='guide',selected='I',rotation=1,orientations={I:1,O:0,T:0,L:0,S:0},placed=[],occupied=new Set(),drag=null,toastTimer;
function fit(){let w=innerWidth,h=innerHeight, s=Math.min(w/1125,h/2000);scale=s;stage.style.transform=`translate(${(w-1125*s)/2}px,${(h-2000*s)/2}px) scale(${s})`;}addEventListener('resize',fit);fit();
function variant(type,k){let p=types[type].map(([x,y])=>[x,y]);for(let i=0;i<k;i++)p=p.map(([x,y])=>[-y,x]);let minX=Math.min(...p.map(v=>v[0])),minY=Math.min(...p.map(v=>v[1]));return p.map(([x,y])=>[x-minX,y-minY]);}
function key(x,y){return `${x},${y}`}function toastMsg(m){toast.textContent=m;toast.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('on'),1800)}function close(){overlay.classList.remove('show')}function modal(html){dialog.innerHTML=html;overlay.classList.add('show')}
function modeMenu(){modal('<h1>テトロミノ</h1><p>どちらであそぶ？</p><button data-mode="guide">LEVEL 1　おてほんあり</button><button data-mode="free">LEVEL 2　おてほんなし</button><p>5しゅるいのピースは何回でも使えます</p>');}
function makeCell(x,y,color,cl,parent,unitW,unitH){let d=document.createElement('div');d.className='piececell '+cl;d.style.left=(x*unitW)+'px';d.style.top=(y*unitH)+'px';d.style.width=unitW+'px';d.style.height=unitH+'px';d.style.background=`linear-gradient(145deg,${color},${color})`;parent.appendChild(d);return d}
function drawBoard(){board.innerHTML='';for(let i=0;i<40;i++){let d=document.createElement('div');d.className='cell';board.appendChild(d)}let cw=board.clientWidth/5,ch=board.clientHeight/8;if(mode==='guide'){for(const [t,cells] of layout){for(const [x,y] of cells)makeCell(x,y,colors[t],'sample',board,cw,ch)}}for(const p of placed){for(const [dx,dy] of p.cells)makeCell(p.x+dx,p.y+dy,colors[p.type],'',board,cw,ch)}}
function paletteDraw(){palette.innerHTML='';for(const type of Object.keys(types)){let btn=document.createElement('button');btn.className='tile'+(selected===type?' selected':'');btn.dataset.type=type;btn.setAttribute('aria-label',type+'型を選ぶ');let pts=variant(type,orientations[type]);let cols=Math.max(...pts.map(p=>p[0]))+1,rows=Math.max(...pts.map(p=>p[1]))+1;let mini=document.createElement('div');mini.className='mini';mini.style.width=(cols*42)+'px';mini.style.height=(rows*42)+'px';for(const [x,y] of pts){let d=document.createElement('div');d.className='mini-square';d.style.position='absolute';d.style.left=x*42+'px';d.style.top=y*42+'px';d.style.background=colors[type];mini.appendChild(d)}btn.append(mini);let label=document.createElement('label');label.textContent=type;btn.appendChild(label);btn.onclick=()=>{if(suppressClick){suppressClick=false;return;}selected=type;rotation=orientations[type];paletteDraw();};btn.addEventListener('pointerdown',paletteDown);palette.appendChild(btn)}}
function expected(type,cells){let s=new Set(cells.map(([x,y])=>key(x,y)));return layout.some(([t,p])=>t===type&&p.every(([x,y])=>s.has(key(x,y))))}
function validPlace(type,rot,x,y){
 const cells=variant(type,rot),abs=cells.map(([dx,dy])=>[x+dx,y+dy]);
 return abs.every(([a,b])=>a>=0&&a<W&&b>=0&&b<H&&!occupied.has(key(a,b)))&&(mode!=='guide'||expected(type,abs));
}
// 指の位置を中心として、近くの置ける場所へ吸着する。
// お手本モードでは、正しい形・回転の場所だけを候補にする。
function snapPlace(type,rot,targetX,targetY,range=1.9){
 const cells=variant(type,rot),maxX=Math.max(...cells.map(v=>v[0])),maxY=Math.max(...cells.map(v=>v[1]));
 const cx=maxX/2,cy=maxY/2;
 let candidates=[];
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(validPlace(type,rot,x,y)){
   const dist=Math.hypot(x+cx-targetX,y+cy-targetY);
   candidates.push({x,y,dist});
 }
 candidates.sort((a,b)=>a.dist-b.dist);
 if(candidates.length&&candidates[0].dist<=range){const p=candidates[0];return place(type,rot,p.x,p.y)}
 toastMsg(mode==='guide'?'おてほんの近くにおいてね':'あいているマスの近くにおいてね');return false;
}
function place(type,rot,x,y){let cells=variant(type,rot),abs=cells.map(([dx,dy])=>[x+dx,y+dy]);if(!abs.every(([a,b])=>a>=0&&a<W&&b>=0&&b<H)){toastMsg('わくの中においてね');return false}if(abs.some(([a,b])=>occupied.has(key(a,b)))){toastMsg('すでにピースがあります');return false}if(mode==='guide'&&!expected(type,abs)){toastMsg('おてほんと同じ場所においてね');return false}placed.push({type,x,y,cells});abs.forEach(([a,b])=>occupied.add(key(a,b)));drawBoard();if(occupied.size===40){modal('<h1>🎉 クリア！</h1><p>40マス、ぜんぶうまりました！</p><button id="again">もういちど</button><button class="alt" id="changeMode">モードをえらぶ</button>')}return true}
function pointOnStage(e){const r=stage.getBoundingClientRect();return {x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}}function onBoard(p){let r=board.getBoundingClientRect(),x=(p.x- (r.left-stage.getBoundingClientRect().left)/scale),y=(p.y-(r.top-stage.getBoundingClientRect().top)/scale);return {x,y,col:Math.floor(x/(board.clientWidth/5)),row:Math.floor(y/(board.clientHeight/8))}}
function paletteDown(e){if(e.button!==0)return;let btn=e.currentTarget,ty=btn.dataset.type;selected=ty;rotation=orientations[ty];let start=pointOnStage(e);drag={id:e.pointerId,type:ty,rot:rotation,x:start.x,y:start.y,moved:false};}
let ghost=[];function clearGhost(){ghost.forEach(el=>el.remove());ghost=[]}function preview(p){clearGhost();let cells=variant(drag.type,drag.rot),cw=board.clientWidth/5,ch=board.clientHeight/8;let maxX=Math.max(...cells.map(v=>v[0])),maxY=Math.max(...cells.map(v=>v[1]));for(const [x,y] of cells){let node=document.createElement('div');node.className='piececell dragcell';node.style.position='absolute';node.style.width=cw+'px';node.style.height=ch+'px';node.style.left=(p.x+(x-maxX/2)*cw-cw/2)+'px';node.style.top=(p.y+(y-maxY/2)*ch-ch/2-90)+'px';node.style.background=colors[drag.type];stage.appendChild(node);ghost.push(node)}}
document.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;let p=pointOnStage(e);if(Math.hypot(p.x-drag.x,p.y-drag.y)>18)drag.moved=true;if(drag.moved)preview(p);});document.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;let d=drag;drag=null;clearGhost();selected=d.type;if(!d.moved){paletteDraw();return;}suppressClick=true;setTimeout(()=>suppressClick=false,250);paletteDraw();let p=pointOnStage(e);p.y-=90;let q=onBoard(p);snapPlace(d.type,d.rot,q.x/(board.clientWidth/5),q.y/(board.clientHeight/8),1.85);});
board.addEventListener('click',e=>{if(drag)return;let r=board.getBoundingClientRect(),px=(e.clientX-r.left)/scale,py=(e.clientY-r.top)/scale,col=Math.floor(px/(board.clientWidth/5)),row=Math.floor(py/(board.clientHeight/8));if(col>=0&&col<W&&row>=0&&row<H){let cells=variant(selected,rotation);let maxX=Math.max(...cells.map(v=>v[0])),maxY=Math.max(...cells.map(v=>v[1]));snapPlace(selected,rotation,col+maxX/2,row+maxY/2,1.8)}});
document.getElementById('rotate').onclick=()=>{rotation=(rotation+1)%4;orientations[selected]=rotation;paletteDraw();toastMsg(selected+'型の向きを変更');};document.getElementById('undo').onclick=()=>{if(!placed.length){toastMsg('まだピースがありません');return}placed.pop();occupied=new Set(placed.flatMap(p=>p.cells.map(([x,y])=>key(p.x+x,p.y+y))));drawBoard()};document.getElementById('reset').onclick=()=>modal('<h1>やりなおす？</h1><p>おいたピースをぜんぶ消します</p><button class="cancel" id="confirmReset">ぜんぶ消す</button><button class="alt" id="cancelReset">キャンセル</button>');document.getElementById('infoHit').onclick=()=>modal('<h1>この教材について</h1><p>PowerPointでデザインした、テトロミノのWebパズルです。</p><p>5つの形を、何回でも使えます。ピースを選んで盤をタップ、またはドラッグ。回転・1つ戻すもできます。</p><button class="alt" id="closeInfo">ゲームにもどる</button><button class="alt" id="openMode">モードをえらぶ</button>');
dialog.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.mode){mode=b.dataset.mode;placed=[];occupied.clear();rotation=orientations[selected];drawBoard();close();toastMsg(mode==='guide'?'おてほんあり':'おてほんなし');return}switch(b.id){case 'confirmReset':placed=[];occupied.clear();drawBoard();close();break;case 'again':placed=[];occupied.clear();drawBoard();close();break;case 'changeMode':case 'openMode':modeMenu();break;default:close()}});
addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('show'))close()});paletteDraw();drawBoard();modeMenu();
})();
</script></body></html>
