<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#24150f"><title>テトロミノ | PowerPoint Webアプリ</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#18100c;font-family:system-ui,'Yu Gothic',sans-serif;touch-action:none}#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}#stage{width:1125px;height:2000px;position:absolute;top:0;left:0;transform-origin:top left;background:url('background.png') center/100% 100% no-repeat;user-select:none;-webkit-user-select:none;touch-action:none}button{font:inherit;cursor:pointer;touch-action:manipulation}#infoHit{position:absolute;top:8px;right:22px;width:180px;height:192px;background:transparent;border:0}#boardFrame{position:absolute;left:191px;top:264px;width:743px;height:1124px;padding:22px;border:9px solid #8b9095;border-radius:22px;background:linear-gradient(115deg,#c8cace 2%,#eeeeee 19%,#a5a8ad 45%,#d5d9dc 69%,#8b8d90 100%);box-shadow:inset 0 0 12px #fff9,0 18px 25px #0009,0 0 0 4px #343434}#board{position:relative;width:100%;height:100%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(8,1fr);border:3px solid #30343a;background:#adb0b5;touch-action:none} .cell{border-right:2px solid #313638;border-bottom:2px solid #313638;background:linear-gradient(100deg,#d6d8da 0%,#a5a8ac 45%,#bfc1c4 100%);position:relative}.cell:after{content:'';position:absolute;inset:2px;border-top:1px solid #fff4} .piececell{position:absolute;border:3px solid #111a24;border-radius:9px;box-shadow:inset 0 9px 0 #ffffff5b,inset 0 -10px 0 #0000002a,0 3px 5px #0005;pointer-events:none;z-index:3}.placedcell{pointer-events:none}.selectedpiece{outline:4px solid #fff;outline-offset:-4px;box-shadow:inset 0 9px 0 #ffffff70,inset 0 -10px 0 #0000002a,0 0 0 4px #ffe37a,0 0 18px #ffe37a}.sample{opacity:.34;box-shadow:inset 0 0 0 2px #ffffff70;z-index:1;border:3px dashed #333}.dragcell{z-index:20;opacity:.84}#palette{position:absolute;left:29px;top:1422px;width:1067px;height:260px;display:flex;align-items:center;gap:10px;padding:12px;background:linear-gradient(#181c1dda,#33261de7);border:3px solid #777;border-radius:20px;box-shadow:0 8px 12px #0009} .tile{flex:1;height:218px;background:linear-gradient(140deg,#27221ce8,#0b0d0de9);border:3px solid #7b878e;border-radius:19px;position:relative;padding:0;overflow:hidden}.tile.selected{border:8px solid #f9db70;box-shadow:0 0 16px #e5c768}.tile .mini{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);display:grid;gap:3px}.mini-square{width:39px;height:39px;border:2px solid #15202a;border-radius:6px;box-shadow:inset 0 6px #fff6,inset 0 -5px #0002}.tile label{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:26px;font-weight:900;color:#eee;pointer-events:none}#actions{position:absolute;left:27px;right:27px;top:1710px;height:143px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}.action{border-radius:27px;border:5px solid #8e9899;color:white;font-weight:1000;font-size:39px;letter-spacing:-1px;text-shadow:0 2px 3px #0008;white-space:nowrap;box-shadow:inset 0 10px 4px #ffffff55,inset 0 -10px 5px #0003,0 8px 7px #0009}.action:active{filter:brightness(1.2)}#rotate{background:linear-gradient(#37a8f3,#0655b8)}#flip{background:linear-gradient(#40ad8f,#146c60)}#undo{background:linear-gradient(#9e9e9e,#333)}#reset{background:linear-gradient(#f35b51,#ae1717)}#hint{position:absolute;top:1872px;left:0;width:100%;text-align:center;font-size:32px;font-weight:700;color:#fff;filter:drop-shadow(1px 3px 3px black)}#overlay{position:absolute;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50}#overlay.show{display:flex}.modal{width:87%;background:#f0f0ed;border:10px solid #7d8b90;border-radius:32px;padding:45px;text-align:center;color:#202025;box-shadow:0 15px 30px #0009}.modal h1{font-size:58px;margin:10px 0 26px}.modal p{font-size:35px;line-height:1.5}.modal button{display:block;width:100%;margin:16px 0;padding:28px 12px;border-radius:18px;font-size:38px;color:white;border:3px solid #285836;background:#287e57;font-weight:900}.modal button.alt{background:#565c69;border-color:#333}.modal button.cancel{background:#aa4242;border-color:#7e2222}.modal.menu{width:84%;padding:34px 38px 38px;border:8px solid #8f959c;border-radius:28px;background:linear-gradient(145deg,#eff2f4 0%,#b8bec5 28%,#f7f8fa 48%,#aab1b8 68%,#e6ebef 100%);box-shadow:inset 0 0 0 3px #ffffff90,0 20px 36px #0009}.modal.menu .menu-mini{font-size:26px;font-weight:900;letter-spacing:.12em;color:#3f4953;margin:0 0 8px}.modal.menu h1{font-size:64px;letter-spacing:.06em;margin:6px 0 8px}.modal.menu .menu-sub{font-size:31px;margin:0 0 22px;color:#24313d}.modal.menu .levelbtn{display:block;width:100%;margin:16px 0;padding:22px 18px;border-radius:22px;text-align:left;border:4px solid #4f5961;background:linear-gradient(180deg,#d9dde1,#aeb7bf);box-shadow:inset 0 8px 4px #ffffff6b,inset 0 -8px 6px #00000024,0 6px 8px #0006;color:#12202b}.modal.menu .levelbtn.level1{border-color:#1f5f8f;background:linear-gradient(180deg,#9fdcff,#2ea2ef 55%,#1364c0);color:#fff}.modal.menu .levelbtn.level2{border-color:#8f5a1f;background:linear-gradient(180deg,#ffd59a,#f09f37 55%,#b66012);color:#fff}.modal.menu .choice-top{display:block;font-size:40px;font-weight:900;line-height:1.1}.modal.menu .choice-sub{display:block;font-size:24px;opacity:.95;margin-top:7px;font-weight:700}.modal.menu .menu-note{font-size:25px;color:#30404b;margin-top:14px}#toast{position:absolute;left:8%;right:8%;top:1325px;z-index:40;background:#1b2425e8;color:white;border:3px solid #d4d8da;border-radius:16px;font-size:32px;font-weight:800;padding:15px 10px;text-align:center;display:none}#toast.on{display:block}
</style></head><body><div id="viewport"><main id="stage" aria-label="テトロミノパズル"><button id="infoHit" aria-label="この教材について"></button><div id="boardFrame"><div id="board" aria-label="5列8行のパズル盤"></div></div><div id="palette" aria-label="ピースを選ぶ"></div><div id="actions"><button class="action" id="rotate">⟳ 回転</button><button class="action" id="flip">⇄ 反転</button><button class="action" id="undo">↶ 1つ戻す</button><button class="action" id="reset">▤ やりなおし</button></div><div id="hint">ピースを選んでタップ、またはドラッグで配置</div><div id="toast" role="status"></div><div id="overlay" class="show"><div id="dialog" class="modal"></div></div></main></div><script>
(()=>{'use strict';
const W=5,H=8,SHAPES={I:[[0,0],[0,1],[0,2],[0,3]],O:[[0,0],[1,0],[0,1],[1,1]],T:[[0,0],[1,0],[2,0],[1,1]],L:[[0,0],[0,1],[0,2],[1,2]],S:[[1,0],[2,0],[0,1],[1,1]]}, COLORS={I:'#16caf1',O:'#f4d12a',T:'#ab3aeb',L:'#f29128',S:'#28cb64'};
const layout=[["I",[[0,0],[0,1],[0,2],[0,3]]],["L",[[1,0],[1,1],[1,2],[2,2]]],["S",[[2,0],[2,1],[3,1],[3,2]]],["L",[[3,0],[4,0],[4,1],[4,2]]],["O",[[3,3],[3,4],[4,3],[4,4]]],["O",[[1,3],[1,4],[2,3],[2,4]]],["T",[[0,4],[0,5],[0,6],[1,5]]],["T",[[3,6],[4,5],[4,6],[4,7]]],["S",[[1,6],[2,5],[2,6],[3,5]]],["I",[[0,7],[1,7],[2,7],[3,7]]]];
const stage=document.getElementById('stage'),board=document.getElementById('board'),palette=document.getElementById('palette'),overlay=document.getElementById('overlay'),dialog=document.getElementById('dialog'),toast=document.getElementById('toast');
let scale=1,mode='guide',selected='I',orientation=Object.fromEntries(Object.keys(SHAPES).map(k=>[k,{r:k==='I'?1:0,f:false}])),placed=[],history=[],active=null,nextId=1,selectedPlaced=null,ignoreBoardClick=false,toastTimer;
const state=()=>JSON.stringify({placed,nextId});function save(){history.push(state());if(history.length>100)history.shift()}
function fit(){let w=innerWidth,h=innerHeight,s=Math.min(w/1125,h/2000);scale=s;stage.style.transform=`translate(${(w-1125*s)/2}px,${(h-2000*s)/2}px) scale(${s})`;}addEventListener('resize',fit);fit();
function shape(type,r=0,f=false){let p=SHAPES[type].map(([x,y])=>[f?-x:x,y]);for(let i=0;i<r;i++)p=p.map(([x,y])=>[-y,x]);let mx=Math.min(...p.map(v=>v[0])),my=Math.min(...p.map(v=>v[1]));return p.map(([x,y])=>[x-mx,y-my]);}
const key=(x,y)=>x+','+y;function msg(m){toast.textContent=m;toast.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('on'),1800)}function close(){overlay.classList.remove('show')}function modal(html,cls=''){dialog.className='modal'+(cls?' '+cls:'');dialog.innerHTML=html;overlay.classList.add('show')}function menu(){modal('<div class="menu-mini">HEAD GAME</div><h1>TETROMINO</h1><p class="menu-sub">レベルをえらんでスタート</p><button class="levelbtn level1" data-mode="guide"><span class="choice-top">LEVEL 1　おてほんあり</span><span class="choice-sub">見本どおりに ならべてみよう</span></button><button class="levelbtn level2" data-mode="free"><span class="choice-top">LEVEL 2　おてほんなし</span><span class="choice-sub">自由にうめる　じっくり挑戦</span></button><p class="menu-note">5しゅるいのピースを 何回でも使えます</p>','menu')}
function cell(x,y,color,cl,parent,cw,ch){let d=document.createElement('div');d.className='piececell '+cl;Object.assign(d.style,{left:x*cw+'px',top:y*ch+'px',width:cw+'px',height:ch+'px',background:color});parent.appendChild(d);return d}
function occupied(exclude=null){let set=new Set();for(let p of placed)if(p.id!==exclude)for(let [x,y] of shape(p.type,p.r,p.f))set.add(key(p.x+x,p.y+y));return set}
function draw(){board.innerHTML='';for(let i=0;i<40;i++){let d=document.createElement('div');d.className='cell';board.appendChild(d)}let cw=board.clientWidth/W,ch=board.clientHeight/H;if(mode==='guide')for(let [type,cells] of layout)for(let [x,y] of cells)cell(x,y,COLORS[type],'sample',board,cw,ch);
for(let p of placed)for(let [x,y] of shape(p.type,p.r,p.f))cell(p.x+x,p.y+y,COLORS[p.type],'placedcell'+(p.id===selectedPlaced?' selectedpiece':''),board,cw,ch)}
function drawPalette(){palette.innerHTML='';for(let type of Object.keys(SHAPES)){let b=document.createElement('button');b.className='tile'+(selected===type?' selected':'');b.dataset.type=type;b.setAttribute('aria-label',type+'型を選ぶ');let pts=shape(type,orientation[type].r,orientation[type].f),cols=1+Math.max(...pts.map(p=>p[0])),rows=1+Math.max(...pts.map(p=>p[1]));let mini=document.createElement('div');mini.className='mini';Object.assign(mini.style,{width:cols*42+'px',height:rows*42+'px'});for(let [x,y] of pts){let d=document.createElement('div');d.className='mini-square';Object.assign(d.style,{position:'absolute',left:x*42+'px',top:y*42+'px',background:COLORS[type]});mini.appendChild(d)}b.appendChild(mini);let label=document.createElement('label');label.textContent=type;b.appendChild(label);b.addEventListener('pointerdown',paletteDown);palette.appendChild(b)}}
function expected(type,abs){const set=new Set(abs.map(([x,y])=>key(x,y)));return layout.some(([t,pts])=>t===type&&pts.every(([x,y])=>set.has(key(x,y))))}
function valid(type,r,f,x,y,exclude=null){let used=occupied(exclude),abs=shape(type,r,f).map(([dx,dy])=>[x+dx,y+dy]);return abs.every(([a,b])=>a>=0&&a<W&&b>=0&&b<H&&!used.has(key(a,b)))&&(mode!=='guide'||expected(type,abs))}
function snap(type,r,f,targetX,targetY,exclude=null,range=2.0){let s=shape(type,r,f),maxX=Math.max(...s.map(p=>p[0])),maxY=Math.max(...s.map(p=>p[1]));let best=null;for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(!valid(type,r,f,x,y,exclude))continue;let dist=Math.hypot(x+maxX/2-targetX,y+maxY/2-targetY);if(!best||dist<best.dist)best={x,y,dist}}return best&&best.dist<=range?best:null}
function commit(type,r,f,x,y,id=null){save();let committedId;if(id===null){committedId=nextId;placed.push({id:nextId++,type,r,f,x,y})}else{let p=placed.find(p=>p.id===id);Object.assign(p,{r,f,x,y});committedId=id}selectedPlaced=committedId;draw();if(occupied().size===40)modal('<h1>🎉 クリア！</h1><p>40マス、ぜんぶうまりました！</p><button id="again">もういちど</button><button class="alt" id="changeMode">モードをえらぶ</button>')}
function stagePoint(e){let r=stage.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}}
function boardPoint(e){let r=board.getBoundingClientRect();return{x:(e.clientX-r.left)/scale/(board.clientWidth/W),y:(e.clientY-r.top)/scale/(board.clientHeight/H)}}
function hit(x,y){return [...placed].reverse().find(p=>shape(p.type,p.r,p.f).some(([dx,dy])=>p.x+dx===x&&p.y+dy===y))}
let ghost=[];function clearGhost(){for(let d of ghost)d.remove();ghost=[]}
function preview(e){clearGhost();if(!active)return;let s=shape(active.type,active.r,active.f),cw=board.clientWidth/W,ch=board.clientHeight/H;let maxX=Math.max(...s.map(v=>v[0])),maxY=Math.max(...s.map(v=>v[1]));let point=stagePoint(e);for(let [x,y] of s){let el=document.createElement('div');el.className='piececell dragcell';Object.assign(el.style,{position:'absolute',width:cw+'px',height:ch+'px',left:(point.x+(x-maxX/2)*cw-cw/2)+'px',top:(point.y+(y-maxY/2)*ch-ch/2-90)+'px',background:COLORS[active.type],pointerEvents:'none'});stage.appendChild(el);ghost.push(el)}}
function paletteDown(e){if(e.button!==0||overlay.classList.contains('show'))return;let type=e.currentTarget.dataset.type;selected=type;selectedPlaced=null;active={pointer:e.pointerId,source:'palette',type,r:orientation[type].r,f:orientation[type].f,start:stagePoint(e),moved:false};drawPalette();e.preventDefault()}
board.addEventListener('pointerdown',e=>{if(e.button!==0||overlay.classList.contains('show'))return;let q=boardPoint(e),col=Math.floor(q.x),row=Math.floor(q.y),p=hit(col,row);if(!p)return;selected=p.type;selectedPlaced=p.id;active={pointer:e.pointerId,source:'board',id:p.id,type:p.type,r:p.r,f:p.f,start:stagePoint(e),moved:false};drawPalette();e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!active||active.pointer!==e.pointerId)return;let p=stagePoint(e);if(Math.hypot(p.x-active.start.x,p.y-active.start.y)>18)active.moved=true;if(active.moved)preview(e)});
document.addEventListener('pointerup',e=>{if(!active||active.pointer!==e.pointerId)return;let d=active;active=null;clearGhost();ignoreBoardClick=true;setTimeout(()=>ignoreBoardClick=false,100);if(!d.moved){if(d.source==='board'){draw();msg('ピースを選びました。回転・反転・ドラッグできます')}return;}let q=boardPoint(e);q.y-=90/(board.clientHeight/H);let result=snap(d.type,d.r,d.f,q.x,q.y,d.source==='board'?d.id:null,1.95);if(result){commit(d.type,d.r,d.f,result.x,result.y,d.source==='board'?d.id:null)}else msg(d.source==='board'?'置けないので元の場所にもどしました':'置ける場所の近くに動かしてね')});document.addEventListener('pointercancel',()=>{active=null;clearGhost()});
board.addEventListener('click',e=>{if(ignoreBoardClick||active||overlay.classList.contains('show'))return;let q=boardPoint(e),col=Math.floor(q.x),row=Math.floor(q.y);if(col<0||col>=W||row<0||row>=H)return;let touched=hit(col,row);if(touched){selectedPlaced=touched.id;selected=touched.type;draw();drawPalette();msg('ピースを選びました。回転・反転・ドラッグできます');return}let o=orientation[selected],s=shape(selected,o.r,o.f),maxX=Math.max(...s.map(p=>p[0])),maxY=Math.max(...s.map(p=>p[1]));let result=snap(selected,o.r,o.f,col+maxX/2,row+maxY/2);if(result){commit(selected,o.r,o.f,result.x,result.y)}else msg('あいている場所を選んでね')});
function modify(flip){if(selectedPlaced!==null){let p=placed.find(q=>q.id===selectedPlaced);if(!p){selectedPlaced=null;return}let nr=flip?p.r:(p.r+1)%4,nf=flip?!p.f:p.f;if(valid(p.type,nr,nf,p.x,p.y,p.id)){commit(p.type,nr,nf,p.x,p.y,p.id);msg(flip?'置いたピースを反転':'置いたピースを回転')}else msg('その場所では回転・反転できません');return}let o=orientation[selected];if(flip)o.f=!o.f;else o.r=(o.r+1)%4;drawPalette();msg(flip?selected+'型を左右反転':selected+'型を90°回転')}document.getElementById('rotate').onclick=()=>modify(false);document.getElementById('flip').onclick=()=>modify(true);
document.getElementById('undo').onclick=()=>{if(!history.length){msg('もどせる操作はありません');return}let last=JSON.parse(history.pop());placed=last.placed;nextId=last.nextId;selectedPlaced=null;draw();msg('1つ前にもどしました')};
document.getElementById('reset').onclick=()=>{let chosen=placed.find(p=>p.id===selectedPlaced);modal('<h1>やりなおし</h1><p>どのように消しますか？</p>'+ (chosen?'<button id="deleteSelected" class="cancel">えらんだピースだけ消す</button>':'<p>ピースを選ぶと、そのピースだけ消せます</p>') +'<button class="cancel" id="confirmReset">ぜんぶ消して最初から</button><button class="alt" id="requestModeChange">レベルをえらびなおす</button><button class="alt" id="cancelReset">キャンセル</button>')};
document.getElementById('infoHit').onclick=()=>modal('<h1>この教材について</h1><p>PowerPointでデザインした、テトロミノのWebパズルです。</p><p>5つの形を何回でも使えます。ピースを選んでタップ、またはドラッグ。置いたピースをタップすると、回転・反転・移動ができます。</p><button class="alt" id="closeInfo">ゲームにもどる</button><button class="alt" id="openMode">モードをえらぶ</button>');
dialog.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.mode){mode=b.dataset.mode;placed=[];history=[];nextId=1;selectedPlaced=null;draw();close();msg(mode==='guide'?'おてほんあり':'おてほんなし');return}switch(b.id){case 'deleteSelected':{let index=placed.findIndex(p=>p.id===selectedPlaced);if(index<0){close();msg('ピースを選んでください');break}save();placed.splice(index,1);selectedPlaced=null;draw();close();msg('選んだピースを消しました');break}case 'confirmReset':placed=[];history=[];nextId=1;selectedPlaced=null;draw();close();break;case 'again':placed=[];history=[];nextId=1;selectedPlaced=null;draw();close();break;case 'requestModeChange':modal('<h1>レベルをかえる？</h1><p>レベルをかえると、いま置いたピースはすべて消えます。</p><button class="cancel" id="confirmModeChange">消してレベルをえらぶ</button><button class="alt" id="cancelModeChange">いまのゲームにもどる</button>');break;case 'confirmModeChange':menu();break;case 'changeMode':case 'openMode':if(placed.length){modal('<h1>レベルをかえる？</h1><p>レベルをかえると、いま置いたピースはすべて消えます。</p><button class="cancel" id="confirmModeChange">消してレベルをえらぶ</button><button class="alt" id="cancelModeChange">いまのゲームにもどる</button>')}else menu();break;default:close()}});addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('show'))close()});drawPalette();draw();menu();
})();
</script></body></html>
